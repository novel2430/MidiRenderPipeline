# Midi Render Pipeline patch registry — active runtime configuration only.
# All LV2 bundles are consolidated under resources/fx/lv2.

[paths]
instruments = "../resources/instruments"
lv2 = "../resources/fx/lv2"
tools = "../resources/tools"
# Optional. If omitted, MRP_LIBSFIZZ/LIBSFIZZ and standard library paths are checked.
# sfizz_library = "/path/to/libsfizz.so"

[effect_renderer]
backend = "native-lv2"
tool = "mrp-lv2-chain"
block_size = 1024

[master]
normalize_peak_db = -1.0
gain_db = -10.0

[melody]
mode = "gm"
gm_program = 71

[post_effects]
drums = ["dragonfly_room"]
synth_lead = ["lead_eq", "dragonfly_plate"]
melody = ["lead_eq", "dragonfly_plate"]

[performance]
enabled = true
constant_spread_max = 4.0
low_percentile = 0.10
high_percentile = 0.90

[performance.instruments.electric_bass]
velocity_min = 50
velocity_nominal = 60
velocity_max = 65

[performance.instruments.string_ensemble]
velocity_min = 30
velocity_nominal = 52
velocity_max = 68

[performance.instruments.acoustic_piano]
velocity_min = 35
velocity_nominal = 62
velocity_max = 95

[performance.instruments.acoustic_guitar]
velocity_min = 40
velocity_nominal = 62
velocity_max = 82

[performance.instruments.electric_guitar_clean]
velocity_min = 30
velocity_nominal = 52
velocity_max = 72

[performance.instruments.electric_guitar_jazz]
velocity_min = 30
velocity_nominal = 52
velocity_max = 72

[performance.instruments.electric_guitar_overdrive]
velocity_min = 45
velocity_nominal = 60
velocity_max = 80

[performance.instruments.drums]
velocity_min = 70
velocity_nominal = 100
velocity_max = 122

[performance.instruments.electric_piano]
velocity_min = 35
velocity_nominal = 62
velocity_max = 88

[libraries.jrhodes]
root = "jRhodes3d"

[libraries.mtg_solosax]
root = "MTG Solo Saxophones"

[libraries.salamander]
root = "AccurateSalamenderGrandPiano"

[libraries.mdm_acoustic]
root = "MDM Acoustic Guitar v1.0 WAV"

[libraries.fashionbass]
root = "Fashionbass"

[libraries.sm_drums]
root = "SM_Drums"

[libraries.vpo]
root = "Virtual-Playing-Orchestra3"

[libraries.fsbs_clean]
