# A family/shared patch may intentionally cover several GM programs. Exact
# patches always win; these are consulted only when an exact patch is absent or
# its SFZ is missing.
[family_fallbacks]
electric_guitar_muted = "electric_guitar_clean"
electric_guitar_harmonics = "electric_guitar_clean"
muted_trumpet = "trumpet"

# Final coverage layer. If exact/family SFZ routing cannot render a track, keep
# a trustworthy original Program Change and render through MuseScore General.
# When Program Change is missing/dirty, use the representative program below.
[general_midi_fallback]
enabled = true
soundfont = "MuseScore_General_Full.sf2"
synth_gain = 0.2
gain_db = 6.0

