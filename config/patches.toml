# Midi Render Pipeline patch registry.
# Paths are relative to this config file unless a library/plugin path is absolute.

[paths]
instruments = "../resources/instruments"
fx = "../resources/fx"
lv2 = "../resources/fx/lv2"
tools = "../resources/tools"

[master]
normalize_peak_db = -1.0
gain_db = -10.0

# Melody is a dataset role, not a fixed instrument. `auto` keeps the source GM
# Program as the timbre hint, preferring our dedicated/family patches first.
# Alternatives:
#   mode = "gm"          # bypass dedicated patches; optional gm_program = 73
#   mode = "instrument"  # force a canonical source; set instrument = "flute"
[melody]
mode = "gm"
gm_program = 71


# Performance Adapter normalizes source-MIDI velocity semantics before the
# sampler. Constant-like tracks are canonicalized to one nominal playing
# intensity. Dynamic tracks use minimal intervention: keep velocities unchanged
# when the robust range is already safe, shift without rescaling when possible,
# and compress only when the source range is wider than the target range. Track
# loudness remains the job of patch gain_db / the mixer, not raw MIDI velocity.
[performance]
enabled = true
constant_spread_max = 4.0
low_percentile = 0.10
high_percentile = 0.90

# Only explicitly calibrated instruments are adapted. Add or retune profiles
# after auditing the corresponding sampler's useful velocity operating range.
[performance.instruments.electric_bass]
velocity_min = 50
velocity_nominal = 60
velocity_max = 65

[performance.instruments.string_ensemble]
velocity_min = 30
velocity_nominal = 52
velocity_max = 68

[performance.instruments.acoustic_piano]
velocity_min = 35
velocity_nominal = 62
velocity_max = 95

[performance.instruments.acoustic_guitar]
velocity_min = 40
velocity_nominal = 62
velocity_max = 82

[performance.instruments.electric_guitar_clean]
velocity_min = 30
velocity_nominal = 52
velocity_max = 72

[performance.instruments.electric_guitar_jazz]
velocity_min = 30
velocity_nominal = 52
velocity_max = 72

[performance.instruments.electric_guitar_overdrive]
velocity_min = 45
velocity_nominal = 60
velocity_max = 80

[performance.instruments.drums]
velocity_min = 70
velocity_nominal = 100
velocity_max = 122

[performance.instruments.electric_piano]
velocity_min = 35
velocity_nominal = 62
velocity_max = 88

