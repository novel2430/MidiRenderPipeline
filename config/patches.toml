[effects.dragonfly_room]
bundle = "DragonflyRoomReverb.lv2"
plugin_uri = "urn:dragonfly:room"
input_channels = 2
tail_seconds = 1.5

[effects.dragonfly_room.params]
dry_level = 80.0
early_level = 10.0
early_send = 20.0
late_level = 20.0
size = 9.0
width = 90.0
predelay = 8.0
decay = 0.2
diffuse = 24.0
spin = 2.1
wander = 10.0
in_high_cut = 16000.0
early_damp = 8200.0
late_damp = 7000.0
low_boost = 40.0
boost_freq = 400.0
in_low_cut = 4.0

[effects.dragonfly_plate]
bundle = "DragonflyPlateReverb.lv2"
plugin_uri = "urn:dragonfly:plate"
input_channels = 2
tail_seconds = 2.5

[effects.dragonfly_plate.params]
dry_level = 90.0
early_level = 10.0
algorithm = 1
width = 90.0
predelay = 0.0
decay = 0.6
low_cut = 100.0
high_cut = 10000.0
early_damp = 7000.0

[effects.gxsvt]
bundle = "gx_ampegsvt.lv2"
plugin_uri = "http://guitarix.sourceforge.net/plugins/gx_ampegsvt_#_ampegsvt_"
input_channels = 1

[effects.gxsvt.params]
BYPASS = 1.0
BASS = 0.60
MIDDLE = 0.30
TREBLE = 0.40
VOLUME = 0.20
LOWSWITCH = 1
MIDSWITCH = 1
HIGHSWITCH = 0
CABSWITCH = 1

[effects.lead_eq]
bundle = "3BandEQ.lv2"
plugin_uri = "http://distrho.sf.net/plugins/3BandEQ"
input_channels = 2

[effects.lead_eq.params]
low = -2.0
mid = 2.0
high = 1.0
master = 2.0
low_mid = 250.0
mid_high = 3000.0

[drum_kick_layer]
enabled = true
sfz = "MuldjordKit SFZ+FLAC-20201018/MuldjordKit 20201018 GM.sfz"
