# GM-only reference config for MidiRenderPipeline 0.5.0.
# This file lives in config/examples/, so paths start with ../../resources.
# Requires an installed SF2 and a discoverable libfluidsynth.
# No dedicated SFZ patches and no LV2 effects are configured.

[paths]
instruments = "../../resources/instruments"
lv2 = "../../resources/fx/lv2"
tools = "../../resources/tools"

[master]
normalize_peak_db = -1.0
gain_db = -10.0

[melody]
mode = "gm"
gm_program = 71

[general_midi_fallback]
enabled = true
soundfont = "MuseScore_General_Full.sf2"
synth_gain = 0.2
gain_db = 6.0

# Use source Program Change when it is trustworthy; otherwise use these
# representative choices for recognized instrument names.
[general_midi_fallback.program_for_instrument]
melody = 71
acoustic_piano = 0
electric_piano = 4
chromatic_percussion = 11
music_box = 10
