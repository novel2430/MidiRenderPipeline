[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-render-pipeline"
version = "0.4.2"
description = "A deterministic MIDI-to-audio rendering system with SFZ, embedded FluidSynth, and native LV2 backends."
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3",
  "numpy>=1.24",
  "soundfile>=0.12",
  "pysfizz>=0.1.3",
]

[project.scripts]
midi-render = "midi_render.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["midi_render*"]
